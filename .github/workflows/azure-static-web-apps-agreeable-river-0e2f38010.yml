name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install Azurite upload-integration dependency
        run: npm install --global azurite
      - name: Restore and test .NET
        run: |
          dotnet restore AgainstTheSpread.sln
          dotnet test AgainstTheSpread.sln -c Release --no-restore
      - name: Install browser test dependencies
        run: |
          cd tests
          npm ci
          npm exec -- tsc -p tsconfig.json --noEmit
          npx playwright install --with-deps chromium
          npm install --global @azure/static-web-apps-cli azure-functions-core-tools@4
      - name: Run browser flows
        env:
          CI: true
        run: |
          ./start-e2e.sh
          cd tests
          npm test
      - name: Stop browser services
        if: always()
        run: ./stop-e2e.sh

  build_and_deploy_job:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: validate
    runs-on: ubuntu-latest
    name: Build and Deploy Original Static Web App
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Build and deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_RIVER_0E2F38010 }}
          action: upload
          app_location: ./src/AgainstTheSpread.Web
          api_location: ./src/AgainstTheSpread.Functions
          output_location: wwwroot

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Environment
    steps:
      - name: Close pull request environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_RIVER_0E2F38010 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          app_location: .
          action: close
